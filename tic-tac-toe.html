<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TicTacToe: Digital Playground</title>
        <link rel="stylesheet" href="tic-tac-toe.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">
        <!-- Lucide Icons CDN -->
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    
    <body>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">TicTacToe</div>
                <div class="nav-links">
                    <a href="#" class="active">Home</a>
                    <a href="#">Leaderboard</a>
                    <a href="#">Settings</a>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn"><i data-lucide="help-circle"></i></button>
                    <button class="icon-btn"><i data-lucide="settings"></i></button>
                </div>
            </div>
        </nav>
    
        <main class="game-container">
            <div class="player-banners">
                <!-- Player X -->
                <div class="player-card active-x">
                    <div class="player-info">
                        <div class="avatar avatar-x">
                            <i data-lucide="x" stroke-width="4"></i>
                        </div>
                        <div class="player-details">
                            <span class="player-label">Player 1</span>
                            <h2 class="player-name">Alex Kinetic</h2>
                        </div>
                    </div>
                    <div class="player-score">
                        <span class="score-value">02</span>
                        <span class="score-label">Wins</span>
                    </div>
                </div>
    
                <!-- Player O -->
                <div class="player-card inactive">
                    <div class="player-info">
                        <div class="avatar avatar-o">
                            <i data-lucide="circle" stroke-width="4"></i>
                        </div>
                        <div class="player-details">
                            <span class="player-label">Player 2</span>
                            <h2 class="player-name">Sam Playful</h2>
                        </div>
                    </div>
                    <div class="player-score">
                        <span class="score-value">01</span>
                        <span class="score-label">Wins</span>
                    </div>
                </div>
            </div>
    
            <div class="game-status">
                <div class="status-title">
                    <span class="status-dot dot-x"></span>
                    Alex Kinetic's Turn
                </div>
                <p class="status-meta">Round 4 • Arena High-Rise</p>
            </div>
    
            <div class="board-wrapper">
                <div class="board">
                    <button class="cell cell-x cell-glow-x"><i data-lucide="x" stroke-width="4"></i></button>
                    <button class="cell"></button>
                    <button class="cell cell-o cell-glow-o"><i data-lucide="circle" stroke-width="4"></i></button>
    
                    <button class="cell"></button>
                    <button class="cell cell-x cell-glow-x"><i data-lucide="x" stroke-width="4"></i></button>
                    <button class="cell"></button>
    
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                </div>
                <div class="glow-top"></div>
                <div class="glow-bottom"></div>
            </div>
    
            <div class="game-controls">
                <button class="btn btn-primary">
                    <i data-lucide="rotate-ccw"></i>
                    Restart Match
                </button>
                <button class="btn btn-secondary">
                    <i data-lucide="log-out"></i>
                    Quit Game
                </button>
            </div>
        </main>
    
        <footer class="footer">
            <div class="footer-container">
                <div class="copyright">
                    © 2024 THE PLAYFUL KINETICIST. DIGITAL PLAYGROUND.
                </div>
                <div class="footer-links">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Github</a>
                </div>
            </div>
        </footer>
    
        <script>
            // Initialize Lucide icons
            lucide.createIcons();
        </script>
    </body>
</html>
