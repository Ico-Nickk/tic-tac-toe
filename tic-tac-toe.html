<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tic-tac-toe.css">
</head>
<body>
    <div class="monitor-frame">
        <!-- Top Section -->
        <div class="player-selection">
            <div class="selection-header">PLAYER SELECTION</div>
            <div class="player-row">
                <div class="select-group">
                    <form action="" class="player1Form">
                        <label for="player1Name">Player 1:</label>
                        <input type="text" placeholder="enter player 1 name" id="player1Name" name="player1Input">
                        <button type="submit">submit</button>
                    </form>
                    <div class="playerSelect">PLAYER 1: SELECT SYMBOL</div>
                    <div class="symbol-toggles">
                        <button class="x-btn player1X selectBtn disabled" value="X">X</button> 
                        <button class="o-btn player1O selectBtn disabled" value="O">O</button>
                    </div>
                </div>
                <div class="select-group">
                    <form action="" class="player2Form">
                        <label for="player2Name">Player 2:</label>
                        <input type="text" placeholder="enter player 2 name" id="player2Name" name="player2Input">
                        <button type="submit">submit</button>
                    </form>
                    <div class="playerSelect">PLAYER 2: SELECT SYMBOL</div>
                    <div class="symbol-toggles">
                        <button class="x-btn player2X selectBtn disabled">X </button>
                        <button class="o-btn player2O selectBtn disabled">O</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-layout">
            <div class="sidebar">
                <div class="status-label">CURRENT TURN:</div>
                <div class="currentPlayersTurn">PLAYER 1 (X)</div>
                <div class="playerSymbol" style="font-size: 4rem; margin: 10px 0;">X</div>
                <div class="status-label">GAME STATUS:</div>
                <div class="status-value">IN PROGRESS</div>
                <div class="reset-start-btns">
                    <button class="resetBtn">Reset</button>
                    <button class="startBtn">Start</button>
                </div>
            </div>
        
            <div class="game-board">
                <div class="cell" id="a1"></div>
                <div class="cell" id="b1"></div>
                <div class="cell" id="c1"></div>
                <div class="cell" id="a2"></div>
                <div class="cell" id="b2"></div>
                <div class="cell" id="c2"></div>
                <div class="cell" id="a3"></div>
                <div class="cell" id="b3"></div>
                <div class="cell" id="c3"></div>
            </div>
            <div class="gameLog">
                <p class="gameLogStatus">Game Log :</p>
                <h3 class="winner">Winner:</h2>
            </div>
        </div>
    </div>
    <script src="tic-tac-toe.js"></script>
</body>
</html>
